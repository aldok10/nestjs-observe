name: Dev Release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dev-release:
    name: Tag and Publish Dev Release
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Check for pending changesets
        id: changesets
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm run build
      - name: Version snapshot packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm changeset version --snapshot dev
      - name: Publish snapshot packages to npm (npmjs.org)
        if: steps.changesets.outputs.has_changesets == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm changeset publish --tag dev --no-git-tag
      - name: Create dev tag and prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          TAG="dev-${TIMESTAMP}-${SHA_SHORT}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 0
          fi
          git tag -a "$TAG" -m "Dev release $TAG"
          git push origin "$TAG"
          if [ "${{ steps.changesets.outputs.has_changesets }}" = "true" ]; then
            NOTE="Automated dev prerelease ${TAG} for commit ${GITHUB_SHA}. Snapshot packages published to npmjs.org with dist-tag dev (no GitHub Packages)."
          else
            NOTE="Automated dev prerelease ${TAG} for commit ${GITHUB_SHA}. No pending changesets; npm snapshot publish skipped."
          fi
          gh release create "$TAG" --prerelease --generate-notes --title "$TAG" --notes "$NOTE"
