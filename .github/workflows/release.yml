name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version, Publish, and Tag
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply changesets version
        id: version
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            pnpm changeset version
            git add -A
            if git diff --staged --quiet; then
              echo "has_release=false" >> "$GITHUB_OUTPUT"
            else
              git commit -m "chore(release): version packages [skip ci]"
              echo "has_release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.version.outputs.has_release == 'true'
        run: pnpm run build
      - name: Publish packages to npm
        if: steps.version.outputs.has_release == 'true'
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Publish packages to GitHub Packages
        if: steps.version.outputs.has_release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@aldok10:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          failed=0
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "Publishing $pkg to GitHub Packages..."
            out=$(cd "$pkg" && npm publish --registry https://npm.pkg.github.com --access public --no-git-checks 2>&1) && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "$out"
              continue
            fi
            if echo "$out" | grep -Eqi 'previously published|cannot publish over|EPUBLISHCONFLICT|cannot publish over the previously published versions'; then
              echo "Skipping already-published package: $pkg"
              continue
            fi
            echo "$out"
            echo "::error::GitHub Packages publish failed for $pkg"
            failed=1
          done < <(pnpm -r --filter './packages/**' exec pwd)
          exit "$failed"
      - name: Push commit and tags
        if: steps.version.outputs.has_release == 'true'
        run: git push --follow-tags
      - name: Create GitHub releases for new tags
        if: steps.version.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists"
            else
              gh release create "$tag" --generate-notes --verify-tag
            fi
          done
