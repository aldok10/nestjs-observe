name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version, Publish, and Tag
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply changesets version
        id: version
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            pnpm changeset version
            git add -A
            if git diff --staged --quiet; then
              echo "has_release=false" >> "$GITHUB_OUTPUT"
            else
              git commit -m "chore(release): version packages [skip ci]"
              echo "has_release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.version.outputs.has_release == 'true'
        run: pnpm run build
      # Preferred: npm Trusted Publishing (OIDC). Configure Trusted Publisher on npmjs.com for this repo/workflow.
      # Fallback: set NPM_TOKEN secret (granular automation token) in the npm environment.
      - name: Publish packages to npm (npmjs.org)
        if: steps.version.outputs.has_release == 'true'
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Push commit and tags
        if: steps.version.outputs.has_release == 'true'
        run: git push --follow-tags
      - name: Create GitHub releases for new tags
        if: steps.version.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists"
            else
              gh release create "$tag" --generate-notes --verify-tag
            fi
          done
