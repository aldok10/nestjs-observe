name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-test:
    name: Node ${{ matrix.node }} / NestJS ${{ matrix.nest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        nest: ['10', '11', '12']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Lint (Oxlint, type-aware)
        run: pnpm run lint:ci -- --type-aware .
      - name: Architecture check
        run: pnpm run lint:arch
      - name: Format check
        run: pnpm run format:check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Package validation (dry-run)
        run: pnpm run publish:dry-run
      - name: Fail loudly on this cell
        if: failure()
        run: |
          echo "::error::Matrix cell node=${{ matrix.node }} nest=${{ matrix.nest }} failed"
          exit 1

  audit:
    name: Production advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install production dependencies
        run: pnpm install --prod --frozen-lockfile
      - name: Require zero production advisories
        run: |
          pnpm audit --prod --json > audit.json
          node -e "const a=require('./audit.json'); const v=(a.metadata&&a.metadata.vulnerabilities)||{}; const t=['info','low','moderate','high','critical'].reduce((s,k)=>s+(Number(v[k])||0),0); console.log('production advisories:', t); if (t !== 0) { console.error('::error::Expected 0 production advisories, found ' + t); process.exit(1); }"

  ci-status:
    name: CI result
    runs-on: ubuntu-latest
    needs: [matrix-test, audit]
    if: always()
    steps:
      - name: Fail if any cell failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '(failure|cancelled|skipped)'; then
            echo "::error::CI failed: $RESULTS"
            exit 1
          fi
          echo "All matrix cells and the production audit passed"
